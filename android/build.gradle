allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url = uri("https://maven.mozilla.org/maven2/")
            content { includeGroup "org.mozilla.geckoview" }
        }
    }
}

rootProject.buildDir = '../build'
project(':m_extension_server') {
    afterEvaluate {
        // Adapt the pinned Android bridge in build/, never edit the shared Pub cache.
        def original = file('src/main/kotlin')
        def patched = tasks.register('prepareNodeLaneMihonSources', Sync) {
            from(original)
            exclude('eu/kanade/tachiyomi/network/interceptor/UserAgentInterceptor.kt')
            into(layout.buildDirectory.dir('generated/nodelane-mihon'))
            filteringCharset = 'UTF-8'
            filesMatching('eu/kanade/tachiyomi/network/NetworkHelper.kt') {
                filter { line -> line.replace('UserAgentInterceptor(::userAgentFor)', 'UserAgentInterceptor(::userAgentFor, ::hasSolvedClearance)') }
            }
        }
        android.sourceSets.main.java.setSrcDirs(android.sourceSets.main.java.srcDirs - original)
        kotlin.sourceSets.main.kotlin.setSrcDirs([patched, rootProject.file('mihon/src/main/kotlin')])
        kotlin.sourceSets.test.kotlin.srcDir(rootProject.file('mihon/src/test/kotlin'))
    }
}
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    afterEvaluate { project ->
    if (project.plugins.hasPlugin("com.android.application") ||
      project.plugins.hasPlugin("com.android.library")) {
      project.android {
        if (project.path != ':app') compileSdkVersion 36
        buildToolsVersion "34.0.0"
      }
    }
    if (project.hasProperty("android")) {
      project.android {
        if (namespace == null) {
          namespace project.group
        }
      }
    }
  }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
