name: 🐞 NodeLane app issue
description: Report a problem in NodeLane Comics
labels: [Bug]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for NodeLane Comics app issues.
        For official source problems or requests, use [NodeLane source plugins](https://github.com/Wy2926/nodelane-comics-extensions/issues/new/choose).
        For third-party sources, use the source's own repository.

  - type: textarea
    id: reproduce-steps
    attributes:
      label: Steps to reproduce
      description: Provide an example of the issue.
      placeholder: |
        Example:
          1. First step
          2. Second step
          3. Issue here
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Explain what you should expect to happen.
      placeholder: |
        Example:
          "This should happen..."
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Explain what actually happens.
      placeholder: |
        Example:
          "This happened instead..."
    validations:
      required: true

  - type: input
    id: nodelane-comics-version
    attributes:
      label: NodeLane Comics version
      description: You can find your NodeLane Comics version in **More → About**. Include the build number when available.
      placeholder: |
        Example: "0.1.0 (1)"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: List your device, model and the OS version.
      placeholder: |
        Example: "iPhone 15, iOS 18.0"
    validations:
      required: true

  - type: textarea
    id: other-details
    attributes:
      label: Other details
      placeholder: |
        Additional details and attachments.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Check these before submitting your report.
      options:
        - label: I have searched the existing issues and this is a new ticket, **NOT** a duplicate or related to another open or closed issue.
          required: true
        - label: I have written a short but informative title.
          required: true
        - label: This concerns the NodeLane Comics app. Source-specific problems belong in the source's repository linked above.
          required: true
